[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-live-bridge"
version = "1.0.0"
description = "Atomic file-queue IPC bridge and ExtendScript generator for executing live commands inside an open Adobe After Effects session."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Tarik", email = "tarikra1@users.noreply.github.com" }
]
keywords = ["after-effects", "extendscript", "jsx", "cep", "mcp", "video-automation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tarikra1/ae-live-bridge"
Repository = "https://github.com/tarikra1/ae-live-bridge"
Changelog = "https://github.com/tarikra1/ae-live-bridge/blob/main/CHANGELOG.md"
Issues = "https://github.com/tarikra1/ae-live-bridge/issues"

[project.scripts]
ae-bridge = "ae_live_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
